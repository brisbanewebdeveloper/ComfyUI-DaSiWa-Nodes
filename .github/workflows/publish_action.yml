name: Publish to Comfy registry
on:
  push:
    branches:
      - main
      - master
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check version bump
        id: version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import subprocess
          import tomllib

          with open("pyproject.toml", "rb") as file:
              current = tomllib.load(file)["project"]["version"]
          previous = tomllib.loads(subprocess.check_output(["git", "show", f"{os.environ['PREVIOUS_SHA']}:pyproject.toml"], text=True))["project"]["version"]
          print(f"changed={str(tuple(map(int, current.split('.'))) > tuple(map(int, previous.split('.')))).lower()}")
          PY
      - name: Install comfy-cli
        if: steps.version.outputs.changed == 'true'
        run: python -m pip install comfy-cli
      - name: Publish Custom Node
        if: steps.version.outputs.changed == 'true'
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$COMFY_REGISTRY_TOKEN"
      - name: Deprecate four predecessors and unpublish older versions
        if: steps.version.outputs.changed == 'true'
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: python .github/scripts/prune_comfy_registry.py