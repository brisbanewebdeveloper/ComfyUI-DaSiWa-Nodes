name: Check Comfy registry status

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Node version to check (defaults to pyproject.toml)"
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  check-registry-status:
    name: Check Custom Node registry status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read node metadata
        id: metadata
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]
          print(f"node_id={project['name']}")
          print(f"version={project['version']}")
          PY

      - name: Check Comfy Registry
        env:
          NODE_ID: ${{ steps.metadata.outputs.node_id }}
          DEFAULT_VERSION: ${{ steps.metadata.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            version="$DEFAULT_VERSION"
          fi
          python .github/scripts/check_comfy_registry_status.py "$NODE_ID" "$version"
